# Vitreus's keys for pleamar-wm: copy this to ~/.config/pleamar/keys.conf (the installer does not touch an existing one).
# It keeps pleamar-wm's own keys (windows, workspaces, the overview on Super+Tab) and points the ones that were Marea's at Vitreus,
# or at the program that does the job. `launch` runs its command through `sh -c`, so quotes work as in a shell.
defaults

# The shell: the launcher, Settings, the lock screen, the wallpaper picker, the Desk.
unbind Super+space
unbind Super+l
bind Super+space        launch pleamar --say vitreus "emit launch_toggle"
bind Super+Shift+space  launch pleamar --say vitreus "emit settings_toggle"
bind Super+l            launch pleamar --say lockscreen "fact locked true"
bind Super+b            launch pleamar --say vitreus "emit wp_picker_toggle"
bind Super+d            launch pleamar --say vitreus "emit desk_toggle"

# Screenshots and recording are Vitreus's Capture: a region, or the whole screen (copied, and saved in ~/Pictures/Screenshots).
unbind Print
unbind Shift+Print
unbind Ctrl+Print
unbind Super+c
unbind Super+Shift+c
bind Print              launch pleamar --say vitreus "emit shot 0"
bind Shift+Print        launch pleamar --say vitreus "emit shot 1"
bind Super+c            launch pleamar --say vitreus "emit shot 0"
bind Super+Shift+c      launch pleamar --say vitreus "emit rec_toggle"

# The keyboard's own keys. Vitreus shows the volume as it changes, whoever changes it.
unbind XF86AudioRaiseVolume
unbind XF86AudioLowerVolume
unbind XF86AudioMute
unbind XF86AudioMicMute
unbind XF86MonBrightnessUp
unbind XF86MonBrightnessDown
unbind XF86AudioPlay
unbind XF86AudioPause
unbind XF86AudioNext
unbind XF86AudioPrev
bind XF86AudioRaiseVolume   repeat locked launch wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind XF86AudioLowerVolume   repeat locked launch wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind XF86AudioMute          locked launch wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind XF86AudioMicMute       locked launch wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind XF86MonBrightnessUp    repeat locked launch brightnessctl set 5%+
bind XF86MonBrightnessDown  repeat locked launch brightnessctl set 5%-
bind XF86AudioPlay          locked launch playerctl play-pause
bind XF86AudioPause         locked launch playerctl play-pause
bind XF86AudioNext          locked launch playerctl next
bind XF86AudioPrev          locked launch playerctl previous
