# Idle and sleep, for hypridle on any compositor that tells it (Hyprland, pleamar-wm): ~/.config/hypr/hypridle.conf.
# lock_cmd and before_sleep_cmd are the lock screen, which has to be running (the installer starts it with the desktop).
general {
    lock_cmd = PATH="$HOME/.local/bin:$PATH" pleamar --say lockscreen "fact locked true"
    before_sleep_cmd = PATH="$HOME/.local/bin:$PATH" pleamar --say lockscreen "fact locked true"
    ignore_dbus_inhibit = false
}

# Locked after five minutes.
listener {
    timeout = 300
    on-timeout = PATH="$HOME/.local/bin:$PATH" pleamar --say lockscreen "fact locked true"
}

# The screen off after seven (on Hyprland: its DPMS; pleamar-wm does it with `idle off-after` in ~/.config/pleamar/session.conf).
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
