# UwU: bubblegum plastic in a neon-arcade mood. Periwinkle and lilac bodies, a deep indigo
# for text and outlines, hot pink for the accent and a flash of yellow.
name = "UwU"
tagline = "Kawaii"
base = "uwu"
font = "Mochiy Pop One"
corner_rounding = 22

[palette]
ink    = "#3a2a8c"
faint  = "#7a6ad0"
mint   = "#ff3d9a"
mintlo = "#d61f7c"
minthi = "#ff7cc0"
onmint = "#ffffff"
tint   = "#e9e2ff"
panel  = "#d4c8ff"
deep   = "#271a5e"
off    = "#cfc6f2"
alert  = "#ff3d6e"

[card]
colors = ["#f1ecff", "#d9ceff", "#271a5e", "#ff3d9a", "#ffd23f"]
