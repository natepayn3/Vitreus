# Doodle: a sketchbook. Warm paper drawers, a thin hand-inked outline with a solid ink shadow off to the bottom right, sticky-note pastels,
# tight corners and a marker handwriting face.
# `tint` is the paper, `ink` the navy-charcoal of the outlines and the writing, `mint` a raspberry marker accent, `deep` the highlighter yellow.
name = "Doodle"
tagline = "Sketchbook"
base = "doodle"
font = "Kalam"
corner_rounding = 3

[palette]
ink    = "#22202e"
faint  = "#6b6577"
mint   = "#e0457b"
mintlo = "#c22f63"
minthi = "#f7a8c4"
onmint = "#fffdf6"
tint   = "#fbf5e8"
panel  = "#fffdf6"
deep   = "#fcd34d"
off    = "#ebe3d2"
alert  = "#e5484d"

[card]
colors = ["#fbf5e8", "#fcd34d", "#22202e", "#e0457b", "#8fd16a"]
