# Doodle: a sticker book. Cream drawers outlined in thick charcoal, pastel fills (butter, rose, lavender, sky, leaf), a chunky rounded typeface.
# `tint` is the cream, `ink` the charcoal of the outlines and the writing, `mint` a periwinkle accent, `deep` the pastel yellow.
name = "Doodle"
tagline = "Stickers"
base = "doodle"
font = "Fredoka"
corner_rounding = 26

[palette]
ink    = "#231f20"
faint  = "#5e5557"
mint   = "#5b72dc"
mintlo = "#4558c0"
minthi = "#aebfef"
onmint = "#ffffff"
tint   = "#fdf4ee"
panel  = "#fffaf6"
deep   = "#fcd77f"
off    = "#e9dfd8"
alert  = "#e9788f"

[card]
colors = ["#fdf4ee", "#aebfef", "#231f20", "#fcd77f", "#e9788f"]
