# Vitreus: the terminal look, for Ghostty. install.sh includes this file from ~/.config/ghostty/config with one line
#   config-file = ?~/.config/pleamar/shells/vitreus/terminal/ghostty.conf
# Ghostty reads an included file after the one that includes it, so these settings replace the same ones in your config.
# To keep one of yours, take the line out (./install.sh --uninstall does) and copy what you want from here instead.

# Space Mono, Space Grotesk's monospaced sibling (the Nerd Font build is the fallback, with its icons)
font-family = Space Mono
font-family = SpaceMono Nerd Font
font-size = 14

# frosted: the window shows the desktop through it (the compositor's blur does the frosting)
background-opacity = 0.78
window-padding-x = 10
window-padding-y = 8
window-padding-balance = true

# a thin bar cursor that does not blink, and a trail behind it when it jumps
cursor-style = bar
cursor-style-blink = false
custom-shader = cursor-trail.glsl
custom-shader-animation = true
