<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>View</title>
  <!-- Made to sit beside Files' icon: the same teal glass, rim and spark. A print of a landscape in a frosted frame. -->
  <defs>
    <linearGradient id="bk" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#9af0d8" stop-opacity="0.92"/><stop offset="0.55" stop-color="#2d9aa8" stop-opacity="0.86"/><stop offset="1" stop-color="#14566a" stop-opacity="0.92"/></linearGradient>
    <linearGradient id="frrim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/><stop offset="0.35" stop-color="#d9fff4" stop-opacity="0.5"/><stop offset="0.7" stop-color="#9ee4d4" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fffb" stop-opacity="0.75"/><stop offset="1" stop-color="#b4f0e0" stop-opacity="0.35"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f7f8f" stop-opacity="0.95"/><stop offset="1" stop-color="#0c4656" stop-opacity="0.95"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cc4c4" stop-opacity="0.9"/><stop offset="1" stop-color="#2d9aa8" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.34"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c8" stop-opacity="1"/><stop offset="0.6" stop-color="#ffd98a" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <clipPath id="pic"><rect x="54" y="62" width="148" height="122" rx="10"/></clipPath>
  </defs>
  <ellipse cx="128" cy="230" rx="100" ry="10" fill="#06222b" fill-opacity="0.10"/><ellipse cx="128" cy="229" rx="88" ry="7" fill="#06222b" fill-opacity="0.14"/><ellipse cx="128" cy="228" rx="72" ry="5" fill="#06222b" fill-opacity="0.18"/>
  <!-- the frame -->
  <rect x="30" y="38" width="196" height="180" rx="24" fill="url(#bk)"/>
  <rect x="30" y="38" width="196" height="180" rx="24" stroke="#06303d" stroke-opacity="0.55" stroke-width="5"/>
  <rect x="30" y="38" width="196" height="180" rx="24" stroke="url(#frrim)" stroke-width="2.6"/>
  <!-- the picture in it -->
  <g clip-path="url(#pic)">
    <rect x="54" y="62" width="148" height="122" fill="url(#sky)"/>
    <circle cx="162" cy="98" r="22" fill="url(#sun)"/>
    <path d="M40 190L96 118L128 152L150 128L214 190Z" fill="url(#hill)"/>
    <path d="M40 190L84 150L112 172L150 140L214 190Z" fill="url(#hill2)" opacity="0.7"/>
    <path d="M96 118L106 131L99 129L91 134Z" fill="#ffffff" fill-opacity="0.8"/>
    <path d="M20 200L92 40H122L50 200Z" fill="url(#sheen)"/>
  </g>
  <rect x="54" y="62" width="148" height="122" rx="10" stroke="#06303d" stroke-opacity="0.5" stroke-width="3.4"/>
  <rect x="54" y="62" width="148" height="122" rx="10" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6"/>
  <!-- the stand of the frame's lower edge, where a caption would go -->
  <path d="M96 202H160" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
  <path d="M42 50Q38 54 38 66V170" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.2"/>
  <circle cx="210" cy="50" r="15" fill="url(#spark)" opacity="0.75"/>
  <path d="M210 37V63M197 50H223" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.95"/>
  <path d="M202 42L218 58M218 42L202 58" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7"/>
</svg>
