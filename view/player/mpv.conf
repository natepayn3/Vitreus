# View's video player: mpv, started by bin/vitreus-view with this folder as its config (--config-dir), so the person's own ~/.config/mpv is left alone.
# The controls are View's (scripts/vitreus-player.lua), drawn in the shell's colours and look; mpv's own are off.
osc=no
osd-bar=no
border=no
title-bar=no
wayland-app-id=vitreus.view
title=${media-title} · View
force-window=immediate
keep-open=always
autofit=1180x800
autofit-smaller=640x360
hwdec=auto-safe
cursor-autohide=1200
osd-font="Space Grotesk"
osd-font-size=30
osd-color="#dfefdf"
osd-border-size=0
osd-shadow-offset=1
sub-font="Space Grotesk"
background=color
save-position-on-quit=no
input-default-bindings=yes
idle=yes
