# View's keys for videos, as close to its keys for pictures as they go (view/view.plm): the rest are mpv's own.
LEFT        seek -5
RIGHT       seek 5
Shift+LEFT  seek -30
Shift+RIGHT seek 30
UP          add volume 5
DOWN        add volume -5
SPACE       cycle pause
k           cycle pause
PGUP        playlist-prev
PGDWN       playlist-next
BS          playlist-prev
HOME        seek 0 absolute
END         playlist-next
f           cycle fullscreen
F11         cycle fullscreen
m           cycle mute
c           script-binding vitreus-player/subs
a           script-binding vitreus-player/audio
[           script-binding vitreus-player/slower
]           script-binding vitreus-player/faster
l           script-binding vitreus-player/loop
i           script-binding vitreus-player/info
ESC         script-binding vitreus-player/escape
q           quit
Ctrl+w      quit

WHEEL_UP    script-binding vitreus-player/wheel_up
WHEEL_DOWN  script-binding vitreus-player/wheel_down
